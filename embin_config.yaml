# =============================================================================
# embin_config.yaml -- the ONE file you edit to run this toolkit
# =============================================================================
#
# Authors: Étienne Artigau, Galina Sherren, René Doyon, Jonathan St-Antoine
#          Université de Montréal / Observatoire du Mont-Mégantic
#
# READ THIS FIRST
# ---------------
# This file is read by BOTH programs of this repository:
#
#     python embin.py        -> one histogram cube + one flux map, from ONE set
#                               of frames
#     python run_chunks.py   -> a whole night, cut into chunks of frames, one
#                               histogram cube + flux map per chunk, plus light
#                               curves
#
# You do NOT need to edit any .py file to use them. Everything below is a
# setting, and every setting is explained. The one line you almost certainly
# have to change is `input.directory` in section 1, which says where your raw
# frames are; results are written into the folder `data_bin/`.
#
# YAML rules, in case this is your first YAML file:
#   * indentation is meaningful: keep exactly the same number of leading spaces
#     you found on the line you are editing, and use spaces, never tabs;
#   * `key: value` pairs, `#` starts a comment;
#   * numbers with a decimal point or an exponent must be written like
#     1.0e-4, NOT 1e-4 (a common cause of "why is this a string?" errors);
#   * `null` means "not set".
#
# Every path below is resolved relative to THIS FILE's folder, not to the
# folder you happen to be standing in when you launch python. So you can run
#     python /somewhere/else/emccd_bintool/run_chunks.py
# from anywhere and it still finds your data.
# =============================================================================

# -----------------------------------------------------------------------
# 1. INPUT FRAMES -- where your raw data is
# -----------------------------------------------------------------------
input:
  # The folder holding the individual raw frames of ONE acquisition sequence.
  # One FITS file = one readout of the camera. Put your frames here (or change
  # this line to point at wherever they already live). A relative path is taken
  # from THIS file's folder; an absolute path is used as-is.
  #
  # Keep the raw frames OUT of a cloud-synced folder (OneDrive, iCloud Drive,
  # Dropbox). Those sync clients evict files they consider cold and leave a
  # zero-block placeholder behind with the full size still showing in `ls`.
  # Reading one gives an empty file, and astropy then reports
  #     OSError: No SIMPLE card found, this file does not appear to be a valid
  #     FITS file
  # on a frame that looks perfectly fine in the file listing. To check a folder
  # on macOS:  find <folder> -name '*.fits' -flags +dataless | wc -l   -> want 0
  directory: "/Users/eartigau/galina/data/"

  # Which files in that folder are frames. "*.fits" means every .fits file.
  pattern: "*.fits"

  # Frames are put in order by the LAST group of digits in their file name, so
  # nc-image_2.fits comes before nc-image_10.fits (an alphabetical sort would
  # get that wrong). `first_file` is the position of the first frame to use in
  # that order, counting from ZERO, and `n_files` is how many frames to take
  # from there.
  #
  #   first_file: 0,  n_files: 64    -> the first 64 frames
  #   first_file: 64, n_files: 64    -> the next 64 frames
  #   first_file: 0,  n_files: null  -> every frame in the folder
  #
  # These two only matter for embin.py. run_chunks.py ignores them and uses
  # section 6 instead, because its whole job is to walk the sequence itself.
  first_file: 0
  n_files: 64

  # Which HDU (extension) of each input file holds the image. PESTO frames put
  # the image in the primary HDU, which is number 0. Leave this alone unless
  # `python -c "from astropy.io import fits; fits.open('yourframe.fits').info()"`
  # tells you the image is somewhere else.
  hdu: 0

# -----------------------------------------------------------------------
# 2. HISTOGRAM BIN EDGES  [raw ADU]
# -----------------------------------------------------------------------
# WHAT A BIN IS HERE. For every pixel of the detector, this toolkit keeps a
# histogram of the ADU values that pixel took across the frames: how many
# frames had it between 0 and 314 ADU, how many between 314 and 321, and so on.
# `edges` is the list of those boundaries. Nbin+1 edges define Nbin bins, so
# the 17 numbers below define 16 bins.
#
# TWO CONVENTIONS, and the fitted physical model assumes both:
#   * The LAST bin is OPEN-ENDED: every pixel value >= edges[-2] (here 1156)
#     lands in it, however large. edges[-1] (here 1157) is therefore only a
#     formal sentinel - it exists so that the list has Nbin+1 entries - and
#     edges[-2] is the real "everything above this" threshold.
#   * The FIRST bin absorbs the underflow: any value below edges[0] is counted
#     in bin 0. Keep edges[0] at 0 so that never actually happens.
#
# WHERE THESE NUMBERS COME FROM. They are not a guess and not a round number
# chosen by hand: they are the optimum computed by bin_optimizer.py for the
# detector constants of section 3, over the flux range 1.0e-3 to 4 e-/frame:
#
#     from bin_optimizer import design_bins
#     d = design_bins(bias=303.6178, gain=71.0598, ron=6.8164, saturation=5000,
#                     nbins=16, mu_min=1.0e-3, mu_max=4.0)
#     print(d.summary())
#     d.edge_list()
#
# Worst-case Fisher information efficiency over that flux range: eta = 0.9887.
# In plain words: these 16 numbers per pixel measure the flux to within 0.6% of
# the precision you would get by keeping every single raw frame. The reasoning
# is in the paper (see the README for where to find it). The short version:
#   * this detector has a large reduced read noise (r = RON/gain = 0.096), so
#     TWO cuts are spent inside the read-noise peak to separate it from the
#     single-electron shoulder;
#   * the rungs above it are evenly spaced in sqrt((ADU - bias)/gain), which is
#     the spacing that follows the widening of the EM-gain tail;
#   * the last finite edge sits at 1156 ADU (about 12 electrons), NOT at the
#     saturation level, because no read ever lands above it at these fluxes and
#     a bin where nothing lands is a wasted bin.
#
# IF YOU CHANGE THE DETECTOR OR THE GAIN SETTING, these edges are wrong for
# your data. Re-run bin_optimizer.py with your own constants and paste the new
# list here. That is the whole point of the tool.
histogram:
  edges: [0, 1994, 2139, 2341, 2621, 2979, 3413, 3926, 3927]

  # For comparison only, do not use: 16 evenly spaced bins over the same range
  # retain a small fraction of the information, because they waste almost every
  # bin on the empty part of the range and none on the read-noise peak, which is
  # where the signal actually is at these fluxes.
  # edges: [0, 300, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000]

# -----------------------------------------------------------------------
# 3. DETECTOR CONSTANTS
# -----------------------------------------------------------------------
# These four numbers describe the camera. They are NOT fitted here: they come
# from a separate calibration and are treated as known.
#
# The values below are for the PESTO EMCCD at Mont-Mégantic, measured in the
# `pesto_stats` project by fitting the full physical model (Poisson electrons
# -> Gamma EM-gain amplification -> Gaussian read noise -> bias) to a
# source-free sky region with an MCMC. They are the posterior medians:
#     bias 303.6178 +/- 0.0022 ADU
#     ron    6.8164 +/- 0.0016 ADU
#     gain  71.0598 +/- 0.21   ADU/e-
# An independent fit to an automatically segmented sky mask agrees to well
# within a percent.
detector:
  bias: 1967.1641
  ron: 6.8654
  gain: 143.4211
  full_well: 5000
  nmax: 40
  cic: 0.0

# -----------------------------------------------------------------------
# 4. FLUX FIT -- turning each pixel's histogram into a flux
# -----------------------------------------------------------------------
# For every pixel, the code computes the probability of that pixel's observed
# histogram for each candidate flux on a grid, and keeps the flux that makes the
# observation most likely (maximum likelihood). The grid below has to bracket
# the true fluxes: a pixel brighter than mu_max cannot be fitted correctly, it
# will just pile up at mu_max.
fit:
  enabled: true        # false -> write the histogram cube only, no flux map
  mu_min: 1.0e-4       # e-/frame, bottom of the flux search grid
  mu_max: 10.0         # e-/frame, top of the flux search grid
  n_grid: 2000         # how many log-spaced grid points between the two. More
                       # points = finer flux resolution and a slower fit.
  chunk_size: 2048     # how many pixels are fitted per matrix multiplication.
                       # Purely a memory/speed knob; lower it if you run out of
                       # RAM, raise it if you have plenty.

  # The error on the flux is ALWAYS written out (the FLUX_ERR extension of the
  # flux file): it is
  # the half-width (MU_HI - MU_LO)/2 of the interval where the log-likelihood has
  # dropped by 0.5 from its peak, which is the standard 1-sigma interval. At low
  # flux that interval is genuinely lopsided, because a flux cannot be negative.
  # Set this to true to ALSO keep the two raw bounds as their own extensions of
  # that same flux file.
  asymmetric_bounds: false

# -----------------------------------------------------------------------
# 5. SOURCES -- finding the stars and saving their raw pixels
# -----------------------------------------------------------------------
# Once the flux map exists, every star in it is located and a small square box
# is cut around it. The FULL, ORIGINAL, unbinned ADU values of every frame
# inside that box are saved, so each star's raw pixel-level time series survives
# the histogram compression untouched.
sources:
  enabled: true
  box_size: 16          # side of the square stamp, in pixels; the star sits at
                        # its centre. Must be even.
  detect_sigma: 8.0     # only sources standing this many sigma above the sky are
                        # kept. Lower it to find fainter things (and more junk).
  significance: error_map   # WHAT THE SIGMA IS DIVIDED BY. These are not two
                        # estimates of one number, they are answers to two
                        # different questions:
                        #
                        #   error_map   -- divide by the source's OWN error, taken
                        #                  from FLUX_ERR and pushed through the
                        #                  same filter. Answers "how well do I know
                        #                  this star's flux?". This is the honest
                        #                  measurement signal-to-noise, and the
                        #                  stricter of the two. Default.
                        #
                        #   map_scatter -- divide by the overall scatter of the
                        #                  filtered map (1.4826 x its median
                        #                  absolute deviation). Answers the
                        #                  classical detection question, "is there
                        #                  anything here at all?". Always the more
                        #                  generous of the two. Assumes the noise is
                        #                  the same everywhere on the detector.
  smooth_sigma: 1.0     # width [pixels] of the small Gaussian filter applied
                        # BEFORE looking for peaks, a stand-in for the PSF, so a
                        # single noisy pixel is not mistaken for a star. Positions
                        # and fluxes are always read off the UNfiltered map.
                        # 0 disables the filter.
  min_separation: 8     # two peaks closer than this many pixels are treated as
                        # the same star; only the stronger one is kept.
  max_sources: 200      # at most this many stamps are written, brightest first.
                        # null means no limit.

# -----------------------------------------------------------------------
# 6. CHUNKS -- only used by run_chunks.py
# -----------------------------------------------------------------------
# WHY CHUNKS EXIST. A histogram is built per PIXEL, so it only means something
# if the star stayed on that pixel for the whole set of frames. Over a real
# acquisition the field drifts (on the PESTO test sequence, about 0.16 pixel per
# second), so histogramming a whole 1000-frame night at once smears every star
# over several pixels and the answer is meaningless. run_chunks.py therefore
# cuts the sequence into consecutive chunks of `size` frames and analyses each
# chunk on its own.
#
# CHOOSING `size` is the usual exposure-time trade-off in a new disguise:
#   * more frames per chunk  -> more reads per pixel -> a finer flux measurement,
#     but the star drifts further during the chunk and gets smeared;
#   * fewer frames per chunk -> the star stays put, but each flux is noisier.
# On the PESTO sequence, 64 frames is 3.1 s and about half a pixel of drift.
#
# Frames left over at the end (the remainder of Nframes / size) are DROPPED, and
# the program says so on screen. With 1001 frames and size 64 you get 15 chunks
# of 64 = 960 frames used, 41 dropped.
chunks:
  size: 64              # frames per chunk
  n_chunks: null        # how many chunks to process. null = as many complete
                        # chunks as fit in the folder. Set a small number (2, 3)
                        # the first time, to check everything works before
                        # launching the full night.
  aperture: 3.0         # radius [pixels] of the circle summed around each star
                        # to build its light curve. Roughly the PSF radius.
  match_radius: 4.0     # how far [pixels] a star is allowed to have moved from
                        # one chunk to the next and still be recognised as the
                        # same star. Must be larger than the drift per chunk and
                        # smaller than the distance between neighbouring stars.
  stamps: true          # false -> skip the raw postage stamps. The output files
                        # get much smaller and the run gets faster, because the
                        # frames then only have to be read once.
  figures: true         # false -> skip the PDF figures at the end

# -----------------------------------------------------------------------
# 7. OUTPUT -- where the results are written
# -----------------------------------------------------------------------
# EVERYTHING this toolkit writes goes into `directory`, which is created if it
# does not exist. Nothing is ever written next to your raw frames.
#
#   embin.py     writes  <directory>/<cube_file>
#                        <directory>/<cube_file, + _flux>
#   run_chunks.py writes <directory>/<chunk_prefix>00.fits, ...01.fits, ...
#                        <directory>/<chunk_prefix>00_flux.fits, ...
#                        <directory>/<summary>
#                        <directory>/<figures>/*.pdf
#
# ... every one of them with '.gz' on the end, unless `compress` below is false.
#
# EVERY RESULT COMES IN TWO FILES, and the split is the point: one holds the
# measurement, the other holds a fit to it.
#
#   the CUBE file, <cube_file> or <chunk_prefix>NN.fits -- ARCHIVE THIS ONE
#     HDU 0  PRIMARY   no data; the header documents the bin edges, the detector
#                      constants, the flux grid and every parameter of the run,
#                      which is enough to redo the fit from this file alone
#     HDU 1  HISTCUBE  3-D cube (Nbin, ny, nx), counts per histogram bin per pixel,
#                      in the narrowest integer type that can hold one count out
#                      of the frames binned: uint8 below 256 frames, uint16 below
#                      65536, int32 above
#     HDU 2  HEADERS   one row per input frame, one column per FITS keyword
#     HDU 3+ STAMPnn   one per detected source: (Nframes, box, box) of RAW ADU,
#                      the pixel-level time series the histogram cannot hold.
#                      Its header carries the source position (XCEN/YCEN, and
#                      XDS9/YDS9 in FITS 1-indexed convention), the stamp corner
#                      (X0/Y0), the fitted peak flux and error (PEAKFLUX/PEAKERR)
#                      and the detection significance (SIGNIF)
#
#   the FLUX file, same name with _flux before the extension
#     HDU 0  PRIMARY   no data; CUBEFILE names the cube above, and the bin edges,
#                      detector constants and flux grid are copied from it
#     HDU 1  FLUX      2-D image, best-fit mean flux [e-/frame] per pixel
#     HDU 2  FLUX_ERR  2-D image, the 1-sigma error on FLUX [e-/frame]
#                      (MU_LO / MU_HI follow when fit.asymmetric_bounds is true)
#
# Nothing fitted is stored in the cube file, so a flux file is never the only
# copy of anything. Deleting one costs a re-fit and no data:
#
#   python embin.py --from-cube data_bin/embin_chunk00.fits.gz
#   # or, in python:
#   from embin import flux_maps_from_cube
#   flux, flux_err, mu_lo, mu_hi = flux_maps_from_cube('data_bin/embin_chunk00.fits.gz')
output:
  directory: "/Users/eartigau/galina/binneddata/" # the output folder
  compress: true                   # gzip every file written here. The '.gz' is
                                   # appended to the names below rather than
                                   # spelled out in them, so you get
                                   # embin_chunk07.fits.gz and, beside it,
                                   # embin_chunk07_flux.fits.gz. astropy
                                   # compresses and decompresses on the file
                                   # name alone, so fits.open() and DS9 read
                                   # them unchanged, and gunzip gives you an
                                   # ordinary FITS file. Worth doing
                                   # systematically: a 16-bin 426 x 1024 cube
                                   # of 64 frames is 7.0 MB of data and 0.75 MB
                                   # on disk, for about 2.5 s of compression.
                                   # false -> plain, uncompressed .fits.
  cube_file: "embin_cube.fits"     # embin.py's cube file; its flux file is the
                                   # same name with _flux before the extension
  chunk_prefix: "embin_chunk"      # run_chunks.py's per-chunk files
  summary: "chunk_summary.fits"    # run_chunks.py's stitched summary file
  figures: "figures"               # sub-folder of `directory` for the PDF plots
  overwrite: true                  # true -> silently replace an existing file of
                                   # the same name. false -> stop with an error
                                   # rather than overwrite anything.

# -----------------------------------------------------------------------
# 8. ASTROMETRY -- putting the flux maps on the sky (pesto_astrometry.py)
# -----------------------------------------------------------------------
# Only read by `pesto_astrometry.py`, which is a separate, optional step run
# AFTER run_chunks.py. It solves the field with astrometry.net and writes a WCS
# into chunk_summary.fits, so that every tracked star gets an RA and a Dec.
#
# The pixel scale is NOT a setting: 0.466 arcsec/px is a measured property of
# PESTO on the OMM 1.6 m (Cadieux et al. 2022, AJ 164, 96), and it is hard-coded
# in pesto_astrometry.py where it belongs. Change it there, not here, and only
# if the instrument itself changed.
astrometry:
  target: "TOI-1452"      # resolved at SIMBAD to get a position to search
                          # around, and propagated to the epoch of your frames
                          # using its proper motion. Leave empty ("") to search
                          # blind, which on a field this small is slow and often
                          # fails: the Nuvu headers carry no pointing at all, so
                          # the target name IS the pointing information.
  search_radius_deg: 0.3  # how far from that position the true field centre is
                          # allowed to be. 0.3 deg is generous for a pointed
                          # observation. If this fails, the same position is
                          # automatically retried with a 2 deg radius before
                          # giving up.
  gaia: true              # false -> skip the independent check against Gaia
                          # DR3. Leave it on: it is what tells you the solution
                          # is right rather than merely self-consistent.

# -----------------------------------------------------------------------
# 9. MCMC DETECTOR CALIBRATION -- only used by embin_mcmc.py
# -----------------------------------------------------------------------
# Section 3 above says the detector constants "are NOT fitted here: they come
# from a separate calibration". `python embin_mcmc.py` IS that separate
# calibration, run on your own frames instead of someone else's.
#
# It pools the raw ADU values of the first `n_frames` frames over every pixel
# into ONE histogram, samples bias / ron / gain / mean-flux-per-pixel from it
# with emcee, writes a three-page PDF report (triangle plot, fit quality, and
# per-pixel uncertainty against per-pixel flux over the whole frame), and prints
# the optimal `histogram: edges:` that follow from the detector it measured --
# ready to paste back into sections 2 and 3.
#
# Nothing else in the toolkit reads this section, so deleting it costs nothing
# but the defaults built into embin_mcmc.py, which are these.
mcmc:
  n_frames: 64          # how many frames to pool. 64 is already 2.8e7 pixel
                        # values, far more than the fit needs; more frames buy
                        # tail statistics for the gain and nothing else.

  # Pixels whose mean across the frames sits further than this many robust
  # sigmas from the median mean are left out of the pooled histogram. The model
  # gives EVERY pixel the same flux, and a star is a pixel with a hundred times
  # the sky flux sitting in exactly the high-ADU tail the gain is read from.
  # null -> fit every pixel and see for yourself how much it moves.
  # This mask applies ONLY to the detector fit. Page 3 of the report always
  # fits every pixel of the frame, stars included: that is its whole point.
  bright_pixel_clip: 5.0

  # The ADU range that is fitted. null -> the full support of the data, i.e.
  # from the lowest to the highest value that occurs at all. The model is
  # renormalised over whatever range is used, so cutting it is safe.
  adu_min: null
  adu_max: null

  # Step, in ADU, of the internal grid the EM-gain continuum is tabulated on
  # before the read noise is convolved in. 0.25 holds the discretisation error
  # below 1.0e-4 of the model everywhere; 0.5 is twice as fast and still below
  # 3.0e-4. The peak of the histogram holds a million counts, so this needs to
  # stay well below the 1.0e-3 Poisson precision of the data.
  grid_step: 0.25

  # How many frames page 3 of the report -- per-pixel uncertainty against
  # per-pixel flux -- fits each pixel from. This is NOT `n_frames` above, and it
  # should be much larger. The pooled histogram has 2.8e7 values whatever
  # `n_frames` is; a per-pixel fit has only this many values PER PIXEL, and at a
  # sky flux of 0.017 e-/frame, 64 frames means about one electron per pixel for
  # the whole sequence. A third of the pixels then see nothing at all, their
  # likelihood never turns over, and the fit pins them to the bottom of the flux
  # grid -- the plot ends up measuring small-number statistics rather than the
  # estimator. null -> every frame in the folder, which is the right answer.
  flux_map_frames: null

  mu_start: 0.02        # first guess at the flux [e-/frame]; only the seed of
                        # the maximum-likelihood search that seeds the walkers.
                        # Bias and RON are seeded from the first frame (its
                        # median, and half its 16-84 percentile range), the
                        # gain from `detector: gain` above.
  walkers: 32           # emcee ensemble size
  steps: 3000           # steps per walker. About 90 s at grid_step 0.25.
  burn: 600             # steps discarded from the head of each chain
  thin: 10              # keep one sample in this many after the burn-in
  seed: 42              # fixed, so a re-run reproduces the same chain

  # Prior ranges: flat between the two bounds, except `mu`, which is flat in
  # log(mu). These are deliberately wide -- they are there to keep the walkers
  # out of unphysical territory, not to express an opinion. There is no `bias`
  # entry: its prior is the first frame's median +-10 %, so it follows the
  # camera without being edited for it.
  priors:
    ron: [0.5, 40.0]          # ADU
    gain: [5.0, 500.0]        # ADU/e-
    mu: [1.0e-6, 10.0]        # e-/frame, log-uniform

  # What to hand bin_optimizer.design_bins once the detector is known. Note
  # `nbins` is yours to choose and the flux range should be no wider than you
  # actually need: the design maximises the WORST case over it, so padding the
  # range costs accuracy everywhere.
  bins:
    nbins: 8
    mu_min: 1.0e-3      # e-/frame
    mu_max: 8.0         # e-/frame
    method: "both"      # "dp" | "closed" | "both" -- see bin_optimizer.py
    n_draws: 24         # posterior samples re-designed, purely to put an error
                        # bar on each edge. About 2 s each; 0 switches it off.

# -----------------------------------------------------------------------
# 10. PSF PHOTOMETRY -- only used by embin_psf.py
# -----------------------------------------------------------------------
# `run_chunks.py` measures each star by summing a fixed aperture. That fails the
# moment two stars sit closer together than the aperture, which is exactly the
# case here: TOI-1452 has a companion 3.1 arcsec away, about seven pixels, and
# no aperture holds one without holding part of the other.
#
# `python embin_psf.py` replaces the aperture with a fit. It finds the stars on
# `astrometry_stack.fits`, fits ONE isotropic Moffat shared by all of them to
# fix their positions, then fits every chunk of `chunk_summary.fits` again with
# the FWHM, the beta and a rigid (dx, dy) shift shared across stars and one
# flux per star. Because the stars are solved TOGETHER, the overlap of the
# blended pair is an off-diagonal element of the normal matrix rather than an
# effect to hope is small: the fluxes are deblended and the error bars carry the
# cost of the deblending.
#
# It writes `psf_photometry.fits` (and the same table as .ecsv): one row per
# chunk, with the time, the FWHM in arcsec, beta, and a flux and flux error for
# every star.
psf:
  # Star finding on the stack, with photutils' DAOStarFinder.
  threshold_sigma: 8.0  # detection threshold, in robust sigmas of the stack
  fwhm_guess: 3.5       # px; the detection kernel width AND the starting point
                        # of the fit. It does not need to be accurate, the fit
                        # moves it, but a wildly wrong value changes WHICH
                        # sources are detected.
  beta_guess: 3.0       # starting Moffat beta. Real seeing profiles land
                        # between 2 and 5; the fit walks there on its own.

  # Beta is measured ONCE, on the deep stack, and held fixed for every chunk.
  # This is not laziness, it is the only thing the data supports. Beta controls
  # the WINGS of the profile, and in a 64-frame chunk a pixel several FWHM from
  # a star sees well under one electron for the entire chunk: its flux estimate
  # is noise-dominated and biased low, and a free beta reads that bias as a
  # genuinely narrow-winged PSF and runs away to its upper bound. On this
  # dataset it railed at 30 in ten chunks out of fifteen, with chi2 still
  # falling monotonically -- the signature of a parameter the data cannot
  # determine. The deep stack has fifteen times the frames and real signal in
  # the wings, so beta is measurable there, and it is a property of the optics
  # and the atmosphere that has no reason to change over 45 seconds anyway.
  #
  # true -> refit beta in every chunk anyway. The per-chunk value is reported
  # with a NaN error bar whenever it lands on a bound, so you can see it happen.
  beta_free: false
  max_stars: 0          # 0 -> keep every detection. Set it to keep only the N
                        # brightest, which is worth doing if the threshold is
                        # low enough to pull in noise peaks.

  # How much of each star is fitted, as a multiple of the FWHM. The fit uses
  # the UNION of these boxes, so a pixel between two blended stars is fitted
  # once with both stars contributing to it. A Moffat has heavy wings, so going
  # much below 4 starts biasing the total flux low.
  fit_radius: 4.0

  # Two stars closer than this many FWHM are reported as a blend, with the
  # inflation of their error bars and their flux-flux correlation. This is a
  # REPORTING threshold only: every star is always fitted jointly with every
  # other, so changing it never changes a flux.
  blend_factor: 3.0

  # The Moffat is averaged over this many sub-positions per pixel per axis
  # before being compared to the data. At a 3-pixel FWHM, sampling at pixel
  # centres instead (oversample: 1) misestimates the peak pixel by several per
  # cent, in a way that depends on where the star falls inside its pixel -- so
  # it turns the drift into a spurious flux wobble. 3 is plenty; the cost is
  # quadratic.
  oversample: 3

  # The sky under the stars: "constant" (one number per chunk) or "plane" (a
  # tilted plane, three numbers). Either way it is solved together with the
  # fluxes, so the flux errors already include not knowing the sky exactly.
  background: "constant"
